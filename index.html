<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>큐브 월드</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap" />
  <style>
    :root {
      --ink: #5b4a6e;
      --pink: #ff9eb5;
      --pink-deep: #e0728f;
      --glass: rgba(255, 255, 255, 0.72);
      --gold: #ffb800;
      --display: 'Jua', 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif;
      --body: system-ui, -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
    }
    html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; }
    body {
      background: #dff1ff; color: var(--ink); font-family: var(--body);
      -webkit-user-select: none; user-select: none; touch-action: none;
    }
    #app { position: fixed; inset: 0; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    [hidden] { display: none !important; }
    button { font: inherit; color: inherit; cursor: pointer; }
    :focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }

    .pill {
      display: flex; align-items: center; gap: 8px; padding: 7px 14px; border-radius: 999px;
      background: var(--glass); backdrop-filter: blur(6px); border: 0; font-size: 13px; line-height: 1;
    }
    .topleft {
      position: fixed; left: max(14px, env(safe-area-inset-left, 0px)); top: max(12px, env(safe-area-inset-top, 0px));
      display: flex; flex-direction: column; align-items: flex-start; gap: 8px;
    }
    .topright {
      position: fixed; right: max(14px, env(safe-area-inset-right, 0px)); top: max(12px, env(safe-area-inset-top, 0px));
      display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end;
    }
    .score { font-family: var(--display); font-size: 22px; padding: 6px 16px 6px 12px; }
    .score svg { width: 22px; height: 22px; flex: none; }
    .score.bump { animation: bump .35s ease-out; }
    @keyframes bump { 40% { transform: scale(1.18); } }
    .compass svg { width: 18px; height: 18px; flex: none; transition: transform .12s linear; }
    .compass span { font-variant-numeric: tabular-nums; }
    .on { background: var(--pink); color: #fff; }

    .hint {
      position: fixed; left: 50%; transform: translateX(-50%);
      top: max(64px, calc(env(safe-area-inset-top, 0px) + 56px));
      max-width: calc(100vw - 32px); box-sizing: border-box; text-align: center;
      padding: 7px 14px; border-radius: 18px; background: var(--glass); backdrop-filter: blur(6px);
      font-size: 13px; line-height: 1.4; pointer-events: none; transition: opacity 1s;
    }
    .hint.hide { opacity: 0; }
    .toast {
      position: fixed; left: 50%; top: 30%; transform: translate(-50%, 0) scale(.9); opacity: 0;
      font-family: var(--display); font-size: clamp(22px, 5vw, 34px); color: #fff; text-align: center;
      text-shadow: 0 2px 0 var(--pink-deep), 0 4px 14px rgba(80, 60, 110, .35);
      pointer-events: none; transition: opacity .35s, transform .35s; max-width: calc(100vw - 32px);
    }
    .toast.show { opacity: 1; transform: translate(-50%, -10px) scale(1); }

    .stick {
      position: fixed; left: max(24px, env(safe-area-inset-left, 0px)); bottom: max(28px, env(safe-area-inset-bottom, 0px));
      width: 120px; height: 120px; border-radius: 50%;
      background: rgba(255, 255, 255, .35); border: 2px solid rgba(255, 255, 255, .7);
      display: grid; place-items: center; touch-action: none;
    }
    .knob { width: 52px; height: 52px; border-radius: 50%; background: rgba(255, 255, 255, .9); box-shadow: 0 2px 8px rgba(80, 60, 110, .25); }
    .jumpbtn, .startbtn {
      border: 0; border-radius: 999px; background: var(--pink); color: #fff; font-family: var(--display);
      box-shadow: 0 4px 0 var(--pink-deep), 0 8px 16px rgba(80, 60, 110, .25); touch-action: none;
    }
    .jumpbtn {
      position: fixed; right: max(28px, env(safe-area-inset-right, 0px)); bottom: max(40px, env(safe-area-inset-bottom, 0px));
      width: 88px; height: 88px; font-size: 20px;
    }
    .jumpbtn:active, .startbtn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--pink-deep); }

    .start {
      position: fixed; inset: 0; display: grid; place-items: center; z-index: 20;
      padding: 16px max(16px, env(safe-area-inset-right, 0px)) 16px max(16px, env(safe-area-inset-left, 0px));
      background: radial-gradient(ellipse at center, rgba(255, 255, 255, .15), rgba(223, 241, 255, .55));
      transition: opacity .5s; touch-action: none;
    }
    .start.hidden { opacity: 0; pointer-events: none; }
    .card {
      width: min(380px, 100%); box-sizing: border-box; padding: 26px 24px 22px; text-align: center;
      background: rgba(255, 255, 255, .86); border-radius: 28px; backdrop-filter: blur(10px);
      box-shadow: 0 18px 50px rgba(80, 60, 110, .22);
    }
    .card h1 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 46px; color: #ff7fa1; letter-spacing: .02em; }
    .card p { margin: 8px 0 0; font-size: 14px; line-height: 1.55; }
    .keys { margin: 16px 0 0; padding: 0; list-style: none; display: grid; gap: 6px; text-align: left; font-size: 13px; }
    .keys li { display: flex; justify-content: space-between; gap: 12px; padding: 7px 12px; border-radius: 12px; background: rgba(255, 158, 181, .14); }
    .keys b { font-weight: 600; white-space: nowrap; }
    .keys span { text-align: right; }
    .startbtn { margin-top: 20px; padding: 12px 44px; font-size: 24px; }
    .tip { font-size: 12px; opacity: .8; }

    @media (prefers-reduced-motion: reduce) {
      .score.bump, .toast, .start { animation: none; transition: none; }
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <div class="topleft">
    <div class="pill score" id="score" aria-live="polite">
      <svg viewBox="-1 -1 2 2" aria-hidden="true"><polygon fill="#ffc933" stroke="#ffb800" stroke-width=".12" stroke-linejoin="round" points="0,-.95 .27,-.33 .93,-.29 .43,.14 .58,.79 0,.43 -.58,.79 -.43,.14 -.93,-.29 -.27,-.33"/></svg>
      <b id="scoreN">0</b>
    </div>
    <div class="pill compass" id="compass" hidden>
      <svg id="arrow" viewBox="-1 -1 2 2" aria-hidden="true"><path fill="#ff7fa1" d="M0 -.9 L.6 .75 L0 .4 L-.6 .75 Z"/></svg>
      <span id="dist">가까운 별</span>
    </div>
    <div class="pill" id="place">초원</div>
  </div>

  <div class="topright">
    <button class="pill" id="timeBtn" type="button">시간 빨리감기 (T)</button>
    <button class="pill" id="muteBtn" type="button">소리 켜짐 (M)</button>
  </div>

  <div class="hint" id="hint" hidden></div>
  <div class="toast" id="toast" role="status"></div>

  <div class="start" id="start">
    <div class="card">
      <h1>큐브 월드</h1>
      <p>끝없이 이어지는 세상을 돌아다니며 별 조각을 모아 보세요.</p>
      <ul class="keys">
        <li><b>이동</b><span>WASD · 방향키 · 왼쪽 스틱</span></li>
        <li><b>점프</b><span>스페이스 · 점프 버튼 (길게 누르면 더 높이)</span></li>
        <li><b>시점</b><span>마우스 드래그 · Q/E · 화면 드래그</span></li>
        <li><b>시간 · 소리</b><span>T 빨리감기 · M 소리 끄기</span></li>
      </ul>
      <p class="tip">높이 뜬 별은 점프로 잡고, 바다에서는 둥둥 떠다닐 수 있어요. 빛나는 마법진을 밟으면 하늘 높이 날아가요.</p>
      <button class="startbtn" id="startBtn" type="button">출발!</button>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
