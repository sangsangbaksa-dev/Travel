<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>큐브 월드</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%23ff9eb5'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap" media="print" onload="this.media='all'" />
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap" /></noscript>
  <style>
    :root {
      --ink: #5b4a6e;
      --pink: #ff9eb5;
      --pink-deep: #e0728f;
      --glass: rgba(255, 255, 255, 0.72);
      --gold: #ffb800;
      --display: 'Jua', 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif;
      --body: system-ui, -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
    }
    html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; }
    body {
      background: #dff1ff; color: var(--ink); font-family: var(--body);
      -webkit-user-select: none; user-select: none; touch-action: none;
    }
    #app { position: fixed; inset: 0; }
    #waterTint { position: fixed; inset: 0; background: rgba(40, 145, 164, .18); opacity: 0; pointer-events: none; transition: opacity .35s; }
    .underwater #waterTint { opacity: 1; }
    #realmFade { position: fixed; inset: 0; z-index: 2; opacity: 0; background: #11121c; pointer-events: none; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    [hidden] { display: none !important; }
    button { font: inherit; color: inherit; cursor: pointer; }
    :focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }

    .reticle {
      position: fixed; left: 50%; top: 50%; width: 18px; height: 18px;
      transform: translate(-50%, -50%); pointer-events: none; opacity: 0;
      filter: drop-shadow(0 1px 2px rgba(38, 44, 57, .6)); transition: opacity .25s;
    }
    .game-started .reticle { opacity: .9; }
    .reticle::before, .reticle::after {
      content: ''; position: absolute; left: 50%; top: 50%; background: white; border-radius: 2px;
      transform: translate(-50%, -50%);
    }
    .reticle::before { width: 14px; height: 1px; }
    .reticle::after { width: 1px; height: 14px; }
    .reticle span {
      position: absolute; inset: 7px; border: 1px solid white; border-radius: 50%;
      background: rgba(60, 66, 78, .65); box-shadow: 0 0 0 1px rgba(60, 66, 78, .3);
    }

    .pill {
      display: flex; align-items: center; gap: 8px; padding: 7px 14px; border-radius: 999px;
      background: var(--glass); backdrop-filter: blur(6px); border: 0; font-size: 13px; line-height: 1;
    }
    .topleft {
      position: fixed; left: max(14px, env(safe-area-inset-left, 0px)); top: max(12px, env(safe-area-inset-top, 0px));
      display: flex; flex-direction: column; align-items: flex-start; gap: 8px;
    }
    .topright {
      position: fixed; right: max(14px, env(safe-area-inset-right, 0px)); top: max(12px, env(safe-area-inset-top, 0px));
      display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end;
    }
    .on { background: var(--pink); color: #fff; }

    .hint {
      position: fixed; left: 50%; transform: translateX(-50%);
      top: max(64px, calc(env(safe-area-inset-top, 0px) + 56px));
      max-width: calc(100vw - 32px); box-sizing: border-box; text-align: center;
      padding: 7px 14px; border-radius: 18px; background: var(--glass); backdrop-filter: blur(6px);
      font-size: 13px; line-height: 1.4; pointer-events: none; transition: opacity 1s;
    }
    .hint.hide { opacity: 0; }
    .toast {
      position: fixed; left: 50%; top: 30%; transform: translate(-50%, 0) scale(.9); opacity: 0;
      z-index: 3;
      font-family: var(--display); font-size: clamp(22px, 5vw, 34px); color: #fff; text-align: center;
      text-shadow: 0 2px 0 var(--pink-deep), 0 4px 14px rgba(80, 60, 110, .35);
      pointer-events: none; transition: opacity .35s, transform .35s; max-width: calc(100vw - 32px);
    }
    .toast.show { opacity: 1; transform: translate(-50%, -10px) scale(1); }

    .stick {
      position: fixed; left: max(24px, env(safe-area-inset-left, 0px)); bottom: max(28px, env(safe-area-inset-bottom, 0px));
      width: 120px; height: 120px; border-radius: 50%;
      background: rgba(255, 255, 255, .35); border: 2px solid rgba(255, 255, 255, .7);
      display: grid; place-items: center; touch-action: none;
    }
    .knob { width: 52px; height: 52px; border-radius: 50%; background: rgba(255, 255, 255, .9); box-shadow: 0 2px 8px rgba(80, 60, 110, .25); }
    .jumpbtn, .divebtn, .startbtn {
      border: 0; border-radius: 999px; background: var(--pink); color: #fff; font-family: var(--display);
      box-shadow: 0 4px 0 var(--pink-deep), 0 8px 16px rgba(80, 60, 110, .25); touch-action: none;
    }
    .jumpbtn {
      position: fixed; right: max(28px, env(safe-area-inset-right, 0px)); bottom: max(40px, env(safe-area-inset-bottom, 0px));
      width: 88px; height: 88px; font-size: 20px;
    }
    .divebtn {
      position: fixed; right: max(42px, env(safe-area-inset-right, 0px)); bottom: max(145px, env(safe-area-inset-bottom, 0px));
      width: 60px; height: 60px; font-size: 16px; background: #79bfcc; box-shadow: 0 4px 0 #5298a9, 0 8px 16px rgba(80, 60, 110, .2);
    }
    .jumpbtn:active, .divebtn:active, .startbtn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--pink-deep); }

    .start {
      position: fixed; inset: 0; display: grid; place-items: center; z-index: 20;
      padding: 16px max(16px, env(safe-area-inset-right, 0px)) 16px max(16px, env(safe-area-inset-left, 0px));
      background: radial-gradient(ellipse at center, rgba(255, 255, 255, .15), rgba(223, 241, 255, .55));
      transition: opacity .5s; touch-action: pan-y; overflow-y: auto;
    }
    .start.hidden { opacity: 0; pointer-events: none; }
    .card {
      width: min(380px, 100%); box-sizing: border-box; padding: 26px 24px 22px; text-align: center;
      background: rgba(255, 255, 255, .86); border-radius: 28px; backdrop-filter: blur(10px);
      box-shadow: 0 18px 50px rgba(80, 60, 110, .22);
    }
    .card h1 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 46px; color: #ff7fa1; letter-spacing: .02em; }
    .card p { margin: 8px 0 0; font-size: 14px; line-height: 1.55; }
    .keys { margin: 16px 0 0; padding: 0; list-style: none; display: grid; gap: 6px; text-align: left; font-size: 13px; }
    .keys li { display: flex; justify-content: space-between; gap: 12px; padding: 7px 12px; border-radius: 12px; background: rgba(255, 158, 181, .14); }
    .keys b { font-weight: 600; white-space: nowrap; }
    .keys span { text-align: right; }
    .startbtn { margin-top: 20px; padding: 12px 44px; font-size: 24px; }
    .tip { font-size: 12px; opacity: .8; }

    @media (max-height: 720px) {
      .card { padding: 14px 16px 12px; }
      .card h1 { font-size: 32px; }
      .keys { margin-top: 8px; gap: 4px; }
      .keys li { padding: 4px 10px; }
      .startbtn { margin-top: 10px; padding: 8px 32px; font-size: 20px; }
    }
    @media (max-height: 480px) {
      .stick { width: 92px; height: 92px; }
      .jumpbtn { width: 64px; height: 64px; font-size: 16px; }
      .divebtn { width: 48px; height: 48px; font-size: 13px; bottom: max(96px, calc(env(safe-area-inset-bottom, 0px) + 88px)); }
    }

    @media (prefers-reduced-motion: reduce) {
      .toast, .start { animation: none; transition: none; }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="waterTint" aria-hidden="true"></div>
  <div id="realmFade" aria-hidden="true"></div>
  <div class="reticle" aria-hidden="true"><span></span></div>

  <div class="topleft">
    <div class="pill" id="place">초원</div>
  </div>

  <div class="topright">
    <button class="pill" id="timeBtn" type="button">시간 빨리감기 (T)</button>
    <button class="pill" id="muteBtn" type="button">소리 켜짐 (M)</button>
  </div>

  <div class="hint" id="hint" hidden></div>
  <div class="toast" id="toast" role="status"></div>

  <div class="start" id="start">
    <div class="card">
      <h1>큐브 월드</h1>
      <p>끝없이 이어지는 세상을 자유롭게 탐험해 보세요.</p>
      <ul class="keys">
        <li><b>이동</b><span>WASD · 방향키 · 왼쪽 스틱</span></li>
        <li><b>점프</b><span>스페이스 · 점프 버튼 (길게 누르면 더 높이)</span></li>
        <li><b>수영</b><span>Shift · 잠수 버튼으로 내려가기, 스페이스로 떠오르기</span></li>
        <li><b>시점</b><span>마우스 이동 · Q/E · 화면 드래그</span></li>
        <li><b>시간 · 소리</b><span>T 빨리감기 · M 소리 끄기</span></li>
      </ul>
      <p class="tip">동굴과 산을 탐험하고 바다에서는 잠수해 보세요.</p>
      <button class="startbtn" id="startBtn" type="button">출발!</button>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
